<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:linear-gradient(135deg,#dbeafe,#eef6ff);
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:460px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0px 15px 35px rgba(0,0,0,.18);
    animation:fadeIn .6s ease-in-out;
}

@keyframes fadeIn{

from{
    opacity:0;
    transform:translateY(20px);
}

to{
    opacity:1;
    transform:translateY(0);
}

}

.logo{

font-size:70px;
color:#0d6efd;

}

h2{

color:#0d6efd;
font-weight:bold;

}

.subtitle{

color:#666;
margin-bottom:25px;

}

.form-label{

font-weight:600;

}

.form-control{

height:48px;
border-radius:10px;

}

.form-control:focus{

box-shadow:0 0 10px rgba(13,110,253,.3);

}

.btn{

height:48px;
font-weight:bold;
border-radius:10px;
transition:.3s;

}

.btn:hover{

transform:translateY(-2px);

}

.footer{

color:#777;
font-size:14px;

}

</style>

</head>

<body>

<div class="login-card">

<div class="text-center">

<i class="fas fa-user-shield logo"></i>

<h2 class="mt-3">

Administrator Login

</h2>

<p class="subtitle">

Login to manage student applications and approvals

</p>

</div>

<hr>

<form action="/admin-dashboard" method="POST">

<div class="mb-3">

<label class="form-label">

<i class="fas fa-envelope"></i>

Admin Username

</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Admin Username"
required>

</div>

<div class="mb-4">

<label class="form-label">

<i class="fas fa-lock"></i>

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<button type="submit" class="btn btn-dark w-100">

<i class="fas fa-right-to-bracket"></i>

Login as Admin

</button>

</form>

<hr>

<div class="d-grid gap-2">

<a href="/" class="btn btn-outline-secondary">

<i class="fas fa-house"></i>

Back to Home

</a>

</div>

<hr>

<div class="text-center footer">

🎓 <strong>AI-Enabled Student Admission System</strong>

<br><br>

Developed by <strong>Parasa Vardhan</strong>

<br><br>

SmartBridge Internship Project • 2026

</div>

</div>

</body>
</html>

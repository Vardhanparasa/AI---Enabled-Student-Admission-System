<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:linear-gradient(135deg,#dbeafe,#eef6ff);
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:480px;
    border:none;
    border-radius:20px;
    padding:35px;
    box-shadow:0px 15px 35px rgba(0,0,0,.18);
}

.logo{
    font-size:70px;
    color:#0d6efd;
}

.form-control{
    height:48px;
    border-radius:10px;
}

.btn{
    height:48px;
    font-weight:bold;
    border-radius:10px;
}

.form-title{
    color:#0d6efd;
    font-weight:bold;
}

.footer-text{
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="card">

<div class="text-center">

<i class="fas fa-user-graduate logo"></i>

<h2 class="form-title mt-3">

Student Registration

</h2>

<p class="text-muted">

Create your student account to apply for admission

</p>

</div>

<hr>

<form action="/register" method="POST">

<div class="mb-3">

<label class="form-label">
<i class="fas fa-user"></i> Full Name
</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label">
<i class="fas fa-envelope"></i> Email Address
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-4">

<label class="form-label">
<i class="fas fa-lock"></i> Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Create a strong password"
required>

</div>

<button class="btn btn-success w-100">

<i class="fas fa-user-plus"></i>

Create Account

</button>

</form>

<hr>

<div class="text-center">

Already have an account?

<br><br>

<a href="/student-login" class="btn btn-primary w-100">

<i class="fas fa-right-to-bracket"></i>

Student Login

</a>

<br><br>

<a href="/" class="btn btn-outline-secondary w-100">

<i class="fas fa-house"></i>

Back to Home

</a>

</div>

<hr>

<p class="footer-text text-center">

🎓 AI-Enabled Student Admission System

<br>

SmartBridge Internship Project • 2026

</p>

</div>

</body>
</html>

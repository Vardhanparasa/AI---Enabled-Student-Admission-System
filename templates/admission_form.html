<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Enabled Student Admission System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

}

.container{

width:100%;

max-width:950px;

background:rgba(255,255,255,0.97);

border-radius:18px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

padding:40px;

animation:fadeIn .8s;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.header{

text-align:center;

margin-bottom:35px;

}

.header h1{

color:#0d6efd;

font-size:34px;

margin-bottom:10px;

}

.header h3{

color:#555;

font-weight:500;

}

.header i{

font-size:55px;

color:#0d6efd;

margin-bottom:15px;

}

form{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

.form-group label{

font-weight:600;

margin-bottom:8px;

color:#333;

}

.required{

color:red;

}

input,select{

padding:13px;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

transition:.3s;

}

input:focus,select:focus{

border-color:#0d6efd;

outline:none;

box-shadow:0 0 10px rgba(13,110,253,.3);

}

.full{

grid-column:1/3;

}

.buttons{

grid-column:1/3;

display:flex;

justify-content:center;

gap:20px;

margin-top:15px;

}

.submit-btn{

background:#0d6efd;

color:white;

padding:14px 35px;

border:none;

border-radius:8px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

.submit-btn:hover{

background:#084298;

transform:translateY(-3px);

}

.reset-btn{

background:#dc3545;

color:white;

padding:14px 35px;

border:none;

border-radius:8px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

.reset-btn:hover{

background:#bb2d3b;

transform:translateY(-3px);

}

.footer{

margin-top:30px;

text-align:center;

color:#666;

font-size:14px;

}

@media(max-width:768px){

form{

grid-template-columns:1fr;

}

.full,.buttons{

grid-column:1;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<i class="fas fa-user-graduate"></i>

<h1>AI Enabled Student Admission System</h1>

<h3>Student Admission Application Form</h3>

</div>

<form action="/submit-application" method="POST">

<div class="form-group">
<label>Age <span class="required">*</span></label>
<input type="number" name="age" min="16" max="30" required>
</div>

<div class="form-group">
<label>Gender <span class="required">*</span></label>
<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Category <span class="required">*</span></label>
<select name="category" required>
<option value="">Select Category</option>
<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>
</select>
</div>

<div class="form-group">
<label>State <span class="required">*</span></label>
<select name="state" required>

<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Karnataka</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Maharashtra</option>
<option>Odisha</option>
<option>Gujarat</option>
<option>Rajasthan</option>
<option>Uttar Pradesh</option>
<option>Madhya Pradesh</option>
<option>Bihar</option>
<option>Punjab</option>
<option>Haryana</option>
<option>Delhi</option>

</select>
</div>

<div class="form-group">
<label>Preferred Stream <span class="required">*</span></label>
<select name="preferred_stream" required>

<option>Engineering</option>
<option>Computer Science</option>
<option>Artificial Intelligence</option>
<option>Information Technology</option>
<option>Electronics</option>
<option>Electrical</option>
<option>Mechanical</option>
<option>Civil</option>
<option>Agriculture</option>
<option>Pharmacy</option>
<option>Management</option>
<option>Arts</option>

</select>
</div>

<div class="form-group">
<label>Entrance Exam <span class="required">*</span></label>
<select name="entrance_exam" required>
<option>JEE</option>
<option>NEET</option>
<option>CET</option>
<option>None</option>
</select>
</div>

<div class="form-group">
<label>Entrance Score <span class="required">*</span></label>
<input type="number" name="entrance_score" min="0" max="300" required>
</div>

<div class="form-group">
<label>Board Percentage <span class="required">*</span></label>
<input type="number" step="0.01" name="board_percentage" min="0" max="100" required>
</div>

<div class="form-group">
<label>Extracurricular Score <span class="required">*</span></label>
<input type="number" name="extracurricular_score" min="0" max="10" required>
</div>

<div class="form-group">
<label>Scholarship Eligibility <span class="required">*</span></label>
<select name="scholarship_eligibility" required>
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="buttons">

<button class="submit-btn" type="submit">

<i class="fas fa-paper-plane"></i>

Submit Application

</button>

<button class="reset-btn" type="reset">

<i class="fas fa-rotate-left"></i>

Reset

</button>

</div>

</form>

<div class="footer">

© 2026 AI Enabled Student Admission System | SmartBridge Project

</div>

</div>

</body>
</html>
